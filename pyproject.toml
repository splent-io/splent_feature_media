[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_media"
version = "0.8.0"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "Pillow>=10",
    # The protected serving route imports the framework's file access
    # registry, so an older one breaks this feature at import time.
    "splent_framework>=1.8.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env,
# requires.features_manual (dependencies invisible to static analysis)
# and provides.routes_manual (routes built from configuration at
# registration time, which have no literal path to find in source).
[tool.splent.contract]
description = "Media library to upload and manage files (the WordPress Media Library analogue)"
archetype = "full"

[tool.splent.contract.provides]
routes     = ["/admin/media", "/admin/media/<int:item_id>", "/admin/media/<int:item_id>/crop", "/admin/media/<int:item_id>/delete", "/admin/media/upload", "/media", "/media/file/<int:item_id>"]
blueprints = []
models     = ["MediaItem"]
commands   = ["hello"]
hooks      = ["layout.authenticated_sidebar"]
services   = ["MediaService"]
signals    = []
translations = ["es"]
docker     = []

[tool.splent.contract.requires]
features = ["auth", "settings"]
features_manual = ["auth"]
env_vars = ["MEDIA_NAV_LABEL", "MEDIA_PUBLIC_GALLERY", "PROTECTED_FILES_ACCEL_PREFIX", "PROTECTED_UPLOADS_DIR"]
signals  = []

[tool.splent.contract.extensible]
services  = ["MediaService"]
templates = ["media/admin.html", "media/admin_detail.html", "media/gallery.html", "media/index.html"]
models    = ["MediaItem"]
hooks     = ["layout.authenticated_sidebar"]
routes    = false

# ── Configuration ─────────────────────────────────────────────────────────
[tool.splent.config]
# Whether uploads are browsable by anyone or only by those who can edit.
MEDIA_PUBLIC_GALLERY = ""
# Main-nav label for the gallery page. Empty keeps it out of the nav.
MEDIA_NAV_LABEL = ""
# Where files that are not public live. Empty means the framework's default
# under the product directory. In production this is the mount target of a
# named volume, so it is set alongside that volume rather than here.
PROTECTED_UPLOADS_DIR = ""
# Internal redirect prefix for handing a protected file to nginx instead of
# streaming it through Python. Empty means stream it, which is correct
# without a proxy in front.
PROTECTED_FILES_ACCEL_PREFIX = ""
