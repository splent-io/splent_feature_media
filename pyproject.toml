[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_media"
version = "0.4.2"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "Pillow>=10",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env, and
# requires.features_manual (dependencies invisible to static analysis).
[tool.splent.contract]
description = "Media library to upload and manage files (the WordPress Media Library analogue)"
archetype = "full"

[tool.splent.contract.provides]
routes     = ["/admin/media", "/admin/media/<int:item_id>", "/admin/media/<int:item_id>/crop", "/admin/media/<int:item_id>/delete", "/admin/media/upload", "/media", "/media/file/<int:item_id>"]
blueprints = []
models     = ["MediaItem"]
commands   = ["hello"]
hooks      = ["layout.authenticated_sidebar"]
services   = ["MediaService"]
signals    = []
translations = []
docker     = []

[tool.splent.contract.requires]
features = ["auth"]
features_manual = ["auth"]
env_vars = ["MEDIA_PUBLIC_GALLERY", "PROTECTED_FILES_ACCEL_PREFIX", "PROTECTED_UPLOADS_DIR"]
signals  = []

[tool.splent.contract.extensible]
services  = ["MediaService"]
templates = ["media/admin.html", "media/admin_detail.html", "media/gallery.html", "media/index.html"]
models    = ["MediaItem"]
hooks     = ["layout.authenticated_sidebar"]
routes    = false
